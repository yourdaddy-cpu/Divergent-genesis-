name: Divergent Genesis - Android

# Build an installable APK on every push so you can download it straight
# from the GitHub Actions tab -> Artifacts -> divergent-genesis-apk.
on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]
  workflow_dispatch:
    inputs:
      export_type:
        description: 'androidPackage = installable APK, androidAppBundle = Play Store AAB'
        default: 'androidPackage'
        type: choice
        options:
          - androidPackage
          - androidAppBundle

concurrency:
  group: dg-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Gate 1 - type-check every script and validate the Unity YAML without
  # Unity. Runs in ~15s and needs no licence, so obvious breakage is caught
  # long before the expensive build.
  # ---------------------------------------------------------------------
  typecheck:
    name: Type-check scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scripts + project structure
        run: |
          pip install pyyaml
          ./Tools/verify.sh

  # ---------------------------------------------------------------------
  # Gate 2 - the real IL2CPP Android build.
  # ---------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: typecheck

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      # Cuts repeat build time roughly in half.
      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-DG-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}
          restore-keys: |
            Library-Android-DG-

      # --- NEW: Generate the Unity License File right here on the server ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install unity-license-activate
        run: npm install --global unity-license-activate

      - name: Generate Unity License File
        # If you have 2FA enabled, change the line below to:
        # run: unity-license-activate "${{ secrets.UNITY_EMAIL }}" "${{ secrets.UNITY_PASSWORD }}" --authenticator-key "${{ secrets.UNITY_TOTP_KEY }}"
        run: unity-license-activate "${{ secrets.UNITY_EMAIL }}" "${{ secrets.UNITY_PASSWORD }}"
      # ---------------------------------------------------------------------

      - name: Build with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          buildMethod: DivergentGenesis.Editor.DGBuildScript.BuildAndroid
          androidExportType: ${{ github.event.inputs.export_type || 'androidPackage' }}
          androidVersionCode: 1
          androidTargetSdkVersion: '35'
          buildName: divergent-genesis
          androidSymbolType: public
          chownFilesTo: ':'
          manualExit: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: divergent-genesis-apk
          path: build/divergent-genesis/**
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Divergent Genesis APK built"
            echo ""
            echo "Download: **Actions -> this run -> Artifacts -> divergent-genesis-apk**"
            echo ""
            echo '```'
            ls -la build/divergent-genesis 2>/dev/null || echo "build/divergent-genesis not found"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
