name: Divergent Genesis - Android

on:
  push:
    branches: [main, master, development]
  workflow_dispatch:
    inputs:
      export_type:
        description: 'androidPackage = APK, androidAppBundle = AAB'
        default: 'androidPackage'
        type: choice
        options:
          - androidPackage
          - androidAppBundle

concurrency:
  group: dg-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scripts + project structure
        run: |
          pip install pyyaml
          ./Tools/verify.sh

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: typecheck
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-DG-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}
          restore-keys: |
            Library-Android-DG-

      # GameCI accepts either a serial (Pro/Plus) or a .ulf licence file
      # (Personal). Failing here says exactly which secret is missing instead of
      # spending five minutes installing Unity first.
      - name: Check the Unity licence secrets
        env:
          SERIAL: ${{ secrets.UNITY_SERIAL }}
          LICENSE: ${{ secrets.UNITY_LICENSE }}
          LICENSE_FILE: ${{ secrets.UNITY_LICENSE_FILE }}
        run: |
          if [ -n "$SERIAL" ]; then
            echo "licence: serial (Pro/Plus)"
          elif [ -n "$LICENSE" ] || [ -n "$LICENSE_FILE" ]; then
            echo "licence: .ulf file (Personal)"
          else
            echo "::error::No Unity licence configured. Add UNITY_EMAIL, UNITY_PASSWORD and UNITY_SERIAL for a Pro/Plus seat, or UNITY_LICENSE with the contents of the .ulf file for Unity Personal - see PUSH_AND_BUILD.md section 2."
            exit 1
          fi

      - name: Build with GameCI
        uses: game-ci/unity-builder@v4
        env:
          # Unity Pro / Plus: email + password + serial
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Unity Personal: the .ulf produced by activation.yml
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          buildMethod: DivergentGenesis.Editor.DGBuildScript.BuildAndroid
          androidExportType: ${{ github.event.inputs.export_type || 'androidPackage' }}
          androidVersionCode: 1
          androidTargetSdkVersion: '35'
          buildName: divergent-genesis
          androidSymbolType: public
          manualExit: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: divergent-genesis-apk
          path: build/divergent-genesis/**
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Divergent Genesis APK built"
            echo ""
            echo "Download: **Actions -> this run -> Artifacts -> divergent-genesis-apk**"
            echo ""
            echo '```'
            ls -la build/divergent-genesis 2>/dev/null || echo "build/divergent-genesis not found"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
